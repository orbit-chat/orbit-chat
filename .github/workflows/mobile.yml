name: Mobile CI

# iOS and Android shells (docs/mobile-plan.md M3/M6): build the mobile renderer, sync it into
# the native projects and compile both apps, unsigned. Catches native plugin breakage
# (native/secure-store) that the web test suite can't see. Both builds are kept as artifacts
# for testing: the Android debug APK installs directly; the unsigned iOS .ipa is for
# sideloading with a free Apple ID (Sideloadly or AltStore re-sign it; see AGENTS.md).

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "v.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mobile builds refuse non-HTTPS servers. Repository variables can point a build elsewhere.
  VITE_API_URL: ${{ vars.MOBILE_API_URL || 'https://orbit.bcgn.net' }}
  VITE_SOCKET_URL: ${{ vars.MOBILE_SOCKET_URL || 'https://orbit.bcgn.net' }}
  VITE_MEDIA_ORIGIN: ${{ vars.MOBILE_MEDIA_ORIGIN || '' }}
  VITE_GIPHY_API_KEY: ""

jobs:
  android:
    name: Android (debug build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the mobile renderer
        run: npm run build:mobile

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        working-directory: android
        # Checkouts from Windows can lose the executable bit.
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Keep the APK
        uses: actions/upload-artifact@v5
        with:
          name: orbit-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS (device build, unsigned)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the mobile renderer
        run: npm run build:mobile

      - name: Sync into the iOS project
        run: npx cap sync ios

      - name: Build
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package an unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Orbit-unsigned.ipa Payload

      - name: Keep the .ipa
        uses: actions/upload-artifact@v5
        with:
          name: orbit-ios-unsigned
          path: Orbit-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
