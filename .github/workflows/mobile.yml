name: Mobile CI

# iOS and Android shells (docs/mobile-plan.md M3/M6): build the mobile renderer, sync it into
# the native projects and compile both apps, unsigned. Catches native plugin breakage
# (native/secure-store) that the web test suite can't see.

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mobile builds refuse non-HTTPS servers; CI only needs well-formed HTTPS values.
  VITE_API_URL: ${{ vars.MOBILE_API_URL || 'https://api.orbitchat.example' }}
  VITE_SOCKET_URL: ${{ vars.MOBILE_SOCKET_URL || 'https://api.orbitchat.example' }}
  VITE_MEDIA_ORIGIN: ${{ vars.MOBILE_MEDIA_ORIGIN || 'https://media.orbitchat.example' }}
  VITE_GIPHY_API_KEY: ""

jobs:
  android:
    name: Android (debug build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the mobile renderer
        run: npm run build:mobile

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        working-directory: android
        # Checkouts from Windows can lose the executable bit.
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the mobile renderer
        run: npm run build:mobile

      - name: Sync into the iOS project
        run: npx cap sync ios

      - name: Build
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
